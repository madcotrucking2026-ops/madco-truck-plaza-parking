# The whole plaza in one command:
#
#   cp .env.prod.example .env.prod   # fill it in — every secret lives THERE
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Five services: postgres, backend (migrates itself at startup), frontend,
# nginx (the only published port), cron (daily reminder sweep + nightly backup).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtpms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: mtpms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtpms"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://mtpms:${POSTGRES_PASSWORD}@postgres:5432/mtpms
      # Fixed and explicit — a generated-per-container secret would log every
      # user out on each restart and never survive a rebuild.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.prod}
      CORS_ORIGINS: '["${PUBLIC_BASE_URL}"]'
      TIMEZONE: ${TIMEZONE:-America/Detroit}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:?set SCHEDULER_TOKEN in .env.prod}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      PARKING_CAPACITY: ${PARKING_CAPACITY:-150}
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time. Same-origin "/…" paths —
        # nginx routes /api to the backend, so no cross-origin round trips.
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # once TLS certs exist (see deploy/nginx.conf)
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

  # One tiny always-on loop instead of host cron — it survives reboots with the
  # stack and needs zero setup on the host OS. Two jobs:
  #   * daily reminder sweep (belt-and-braces behind the in-process scheduler)
  #   * nightly pg_dump, kept 14 days, into the ./backups bind mount so the
  #     files are on the HOST disk, not inside a container that can be removed.
  cron:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1 || true
        echo "cron: sweeping reminders + nightly backup, keeping 14 days"
        while true; do
          curl -sf -X POST -H "X-Scheduler-Token: $$SCHEDULER_TOKEN" http://backend:8000/api/reminders/cron \
            && echo "cron: reminder sweep ok $$(date)" || echo "cron: reminder sweep FAILED $$(date)"
          pg_dump -h postgres -U mtpms mtpms | gzip > "/backups/mtpms-$$(date +%Y%m%d-%H%M).sql.gz" \
            && echo "cron: backup ok $$(date)" || echo "cron: backup FAILED $$(date)"
          ls -1t /backups/mtpms-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm --
          sleep 86400
        done

volumes:
  postgres_data:
  backend_logs:
