# The whole plaza in one command:
#
#   cp .env.prod.example .env.prod   # fill it in — every secret lives THERE
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Five services: postgres, backend (migrates itself at startup), frontend,
# nginx (the only published port), cron (nightly database backup).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtpms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: mtpms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtpms"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://mtpms:${POSTGRES_PASSWORD}@postgres:5432/mtpms
      # Fixed and explicit — a generated-per-container secret would log every
      # user out on each restart and never survive a rebuild.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.prod}
      CORS_ORIGINS: '["${PUBLIC_BASE_URL}"]'
      DOCS_ENABLED: "false"  # no Swagger UI / OpenAPI schema in prod
      TIMEZONE: ${TIMEZONE:-America/Detroit}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      PARKING_CAPACITY: ${PARKING_CAPACITY:-150}
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time. Same-origin "/…" paths —
        # nginx routes /api to the backend, so no cross-origin round trips.
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # NGINX_CONF=nginx-tls.conf in .env.prod flips to HTTPS once the first
      # certificate exists. Default is plain HTTP for the LAN.
      - ./deploy/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    # Reload every 6h so a renewed certificate is picked up without a restart.
    # The loop starts sleeping first, so nginx is always up before any reload.
    command: /bin/sh -c "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"
    depends_on:
      - backend
      - frontend

  # Renews the certificate twice a day (certbot itself only acts when <30 days
  # remain). Runs ONLY with --profile tls — pointless before a domain exists.
  # The FIRST certificate is a one-shot `docker compose run` (DEPLOY.md step 1);
  # --cert-name mtpms pins the path nginx-tls.conf expects.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    profiles: ["tls"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h
        done

  # One tiny always-on loop instead of host cron — it survives reboots with the
  # stack and needs zero setup on the host OS. Nightly pg_dump, kept 14 days,
  # into the ./backups bind mount so the files are on the HOST disk, not inside
  # a container that can be removed.
  cron:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "cron: nightly backup, keeping 14 days"
        while true; do
          pg_dump -h postgres -U mtpms mtpms | gzip > "/backups/mtpms-$$(date +%Y%m%d-%H%M).sql.gz" \
            && echo "cron: backup ok $$(date)" || echo "cron: backup FAILED $$(date)"
          ls -1t /backups/mtpms-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm --
          sleep 86400
        done

volumes:
  postgres_data:
  backend_logs:
  certbot_certs:
  certbot_webroot:
