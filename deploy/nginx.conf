# MTPMS reverse proxy — one public port, two upstreams.
#
# TLS terminates HERE when the client has a domain: put the certs in
# deploy/certs/, uncomment the 443 block below, and the app containers never
# know HTTPS exists. Until then this serves plain HTTP on the LAN.

events {}

http {
    # Stripe webhooks and QR verify links come from outside; keep body limits
    # sane but not tiny (receipt PDFs are served, never uploaded).
    client_max_body_size 2m;

    # The backend sees the real client IP, not the proxy's — the rate limiters
    # key on it. (The app deliberately ignores X-Forwarded-For from anyone
    # except this proxy, so set it only here.)
    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:3000; }

    server {
        listen 80;

        # Let's Encrypt HTTP-01 challenges — served from the shared certbot
        # webroot so the FIRST certificate can be issued while still on HTTP
        # (then flip NGINX_CONF=nginx-tls.conf and restart nginx).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS lives in deploy/nginx-tls.conf — set NGINX_CONF=nginx-tls.conf in
    # .env.prod once the certificate exists (see DEPLOY.md go-live step 1).
}
