# MTPMS reverse proxy — TLS mode.
#
# Activate by setting NGINX_CONF=nginx-tls.conf in .env.prod AFTER the first
# certificate exists (DEPLOY.md go-live step 1). Certificate paths are FIXED —
# certbot is always run with `--cert-name mtpms`, so this file needs no
# domain-specific editing at all.

events {}

http {
    # Docker recreates containers with NEW IPs on every `up -d --build`. An
    # `upstream {}` block resolves DNS once at nginx startup, so after an app
    # update nginx keeps proxying to dead IPs — 502s until someone restarts it.
    # Using Docker's embedded DNS (127.0.0.11) with a short TTL plus variable
    # proxy targets forces re-resolution per request instead.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 2m;

    # Port 80: answer ACME renewals, bounce everything else to HTTPS.
    server {
        listen 80;
        set $backend_url http://backend:8000;
        set $frontend_url http://frontend:3000;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        set $backend_url http://backend:8000;
        set $frontend_url http://frontend:3000;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/mtpms/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mtpms/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Modest HSTS (1 week): long enough that browsers stop trying HTTP,
        # short enough that a certificate mishap doesn't lock customers out
        # for a year. Lengthen once the domain has been stable for a while.
        add_header Strict-Transport-Security "max-age=604800" always;

        location /api/ {
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass $frontend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
